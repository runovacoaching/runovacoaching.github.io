  return `<div class="pc ${nw?'new':''}" ${i.a?`data-go="${esc(i.a)}" data-t="${esc(i.t||'')}"`:''} style="cursor:pointer"><div class="ph"><span>${esc(new Date(i.at).toLocaleString())}</span>${nw?'<span class="bdg" style="--c:#FF4F5E;margin:0">New</span>':''}</div><div>${i.h}</div></div>`}).join(''):'<div class="card empty">No updates yet.</div>');
 document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{picked=e.dataset.go;jump=e.dataset.t||null;view='athletes';coachView()})}

async function cRaces(mn){
 const {data}=await sb.from('races').select('*').order('race_date');
 const rs=data||[];
 mn.innerHTML=H('Races')+(me.role=='admin'?`<div class="card"><div class="grid"><div class="full"><label for="rn">Race Name</label><input id="rn"></div>
 <div><label for="rd">Date</label><input id="rd" type="date"></div><div><label for="rk">Distance</label><select id="rk"><option>5K</option><option>10K</option><option>21K</option><option>42K</option></select></div>
 <div class="full"><label for="rl">Location</label><input id="rl"></div><div class="full"><label>Links (Optional)</label><div id="rls"><input class="lk" placeholder="https://..." autocapitalize="none"></div><button type="button" class="sm" id="rladd">+ Add Link</button></div><div class="full"><button id="radd">Add Race</button></div></div><p class="err" id="rerr" role="alert"></p></div>`:'')+`<h2>All Races</h2>${rs.length?rs.map(r=>`<div class="pc"><div class="ph"><span>${esc(r.race_date)}</span>${me.role=='admin'?`<button class="x" data-del="${esc(r.id)}" aria-label="Delete race">×</button>`:''}</div>
 <div class="pt"><b>${esc(r.name)}</b><span class="tot">${dl(r.race_date)}</span></div><div class="m">${[r.distance,r.location].filter(Boolean).map(esc).join(' • ')}</div>${linkHTML(r.link,'Race Page')}</div>`).join(''):'<div class="card empty">No races yet.</div>'}`;
 if($('#rladd'))$('#rladd').onclick=()=>{const i=document.createElement('input');i.className='lk';i.placeholder='https://...';i.style.marginTop='8px';$('#rls').appendChild(i)};
 if($('#radd'))$('#radd').onclick=async()=>{
  if(!$('#rn').value.trim()||!$('#rd').value)return $('#rerr').textContent='Add a race name and a date.';
  const rl=[...document.querySelectorAll('#rls .lk')].map(x=>x.value.trim()).filter(Boolean);if(rl.some(x=>!url(x)))return $('#rerr').textContent='That link doesn’t look right.';
  const {error}=await sb.from('races').insert({name:$('#rn').value.trim(),race_date:$('#rd').value,distance:$('#rk').value.trim()||null,location:$('#rl').value.trim()||null,link:rl.map(url).join('\n')||null});
  if(error)return $('#rerr').textContent=msg(error);coachView()};
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this race? It is removed from every athlete too.'))return;await sb.from('races').delete().eq('id',b.dataset.del);coachView()})}

async function aNotes(mn){
 const prev=new Date(getSeen());
 const [pr,cr,rr,er]=await Promise.all([sb.from('plans').select('*').order('created_at',{ascending:false}).limit(30),sb.from('comments').select('*').order('created_at',{ascending:false}).limit(30),sb.from('athlete_races').select('*').order('created_at',{ascending:false}).limit(20),sb.from('workouts').select('id,type,workout_date,edited_at').not('edited_at','is',null).order('edited_at',{ascending:false}).limit(30)]);
 const wid=[...new Set((cr.data||[]).map(c=>c.workout_id))],rid=[...new Set((rr.data||[]).map(x=>x.race_id))];
 const [wd,rd]=await Promise.all([wid.length?sb.from('workouts').select('id,type,workout_date').in('id',wid):{data:[]},rid.length?sb.from('races').select('id,name,race_date').in('id',rid):{data:[]}]);
 setSeen();
 const wm={},rm={};(wd.data||[]).forEach(w=>wm[w.id]=w);(rd.data||[]).forEach(r=>rm[r.id]=r);
 const items=[...(pr.data||[]).map(p=>({v:'plan',t:'pc-'+p.id,at:p.created_at,h:`Your coach added <b>${esc(p.title)}</b> for ${esc(p.plan_date)}${tot(p)?' • '+tot(p):''}`})),
  ...(cr.data||[]).map(c=>{const w=wm[c.workout_id];return{v:'load',t:'w-'+c.workout_id,at:c.created_at,h:`Your coach commented on your ${esc(w?(TYPES[w.type]||w.type):'activity')}${w?' ('+esc(w.workout_date)+')':''}<div class="cm">${esc(c.body)}</div>`}}),
  ...(rr.data||[]).filter(x=>rm[x.race_id]).map(x=>({v:'home',at:x.created_at,h:`You were assigned <b>${esc(rm[x.race_id].name)}</b> (${esc(rm[x.race_id].race_date)})${x.goal?' • Goal: '+esc(x.goal):''}`})),...(er.data||[]).map(w=>({v:'load',t:'w-'+w.id,at:w.edited_at,h:`Your coach edited your ${esc(TYPES[w.type]||w.type)} (${esc(w.workout_date)})`}))].filter(i=>i.at).sort((x,y)=>new Date(y.at)-new Date(x.at)).slice(0,50);
 mn.innerHTML=`<div class="narrow">${H('Notifications')}${items.length?items.map(i=>{const nw=new Date(i.at)>prev;
  return `<div class="pc ${nw?'new':''}" data-v="${i.v}" data-t="${esc(i.t||'')}" style="cursor:pointer"><div class="ph"><span>${esc(new Date(i.at).toLocaleString())}</span>${nw?'<span class="bdg" style="--c:#FF4F5E;margin:0">New</span>':''}</div><div>${i.h}</div></div>`}).join(''):'<div class="card empty">No updates yet.</div>'}</div>`;
 document.querySelectorAll('[data-v]').forEach(e=>e.onclick=()=>{view=e.dataset.v;jump=e.dataset.t||null;athleteView()})}
