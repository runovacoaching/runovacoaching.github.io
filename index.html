function initChart(ps,ws){const sum=(l,k)=>l.reduce((t,x)=>t+(+x[k]||0),0),draw=()=>{const a0=$('#cfrom').value,b0=$('#cto').value,g=$('#cg'),m=$('#cmsg');if(!a0||!b0||a0>b0){g.innerHTML='';m.textContent='Choose a valid date range.';return}

  const {error}=await sb.from('races').insert({name:$('#rn').value.trim(),race_date:$('#rd').value,distance:ds.join(' / '),distances:ds,location:$('#rl').value.trim()||null,link:rl.map(url).join('\n')||null});
  if(error)return $('#rerr').textContent=msg(error);coachView()};
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this race? It is removed from every athlete too.'))return;await sb.from('races').delete().eq('id',b.dataset.del);coachView()})}

let reads=null,NI=[];
const lrk=()=>'runova_reads_'+(me?me.id:''),lrGet=()=>{try{return new Set(JSON.parse(localStorage.getItem(lrk())||'[]'))}catch(e){return new Set()}};
async function loadReads(){
 const {data,error}=await sb.from('notif_reads').select('item_key,read_at').eq('user_id',me.id).limit(5000);
 if(error){reads={keys:lrGet(),init:new Date(getSeen()),off:true};return reads}
 const keys=new Set((data||[]).map(x=>x.item_key)),ini=(data||[]).find(x=>x.item_key=='__init'),at=ini?ini.read_at:new Date().toISOString();
 if(!ini)await sb.from('notif_reads').upsert({user_id:me.id,item_key:'__init',read_at:at},{onConflict:'user_id,item_key'});
 reads={keys,init:new Date(at)};return reads}
const isNew=i=>!!reads&&new Date(i.at)>reads.init&&!reads.keys.has(i.k);
const markRead=async k=>{if(!k||!reads||reads.keys.has(k))return;reads.keys.add(k);if(reads.off){try{localStorage.setItem(lrk(),JSON.stringify([...reads.keys].slice(-500)))}catch(e){}return}await sb.from('notif_reads').upsert({user_id:me.id,item_key:k},{onConflict:'user_id,item_key'})};
async function aItems(){
 const [pr,cr,rr,er]=await Promise.all([sb.from('plans').select('*').order('created_at',{ascending:false}).limit(30),sb.from('comments').select('*').order('created_at',{ascending:false}).limit(30),sb.from('athlete_races').select('*').order('created_at',{ascending:false}).limit(20),sb.from('workouts').select('id,type,workout_date,edited_at').not('edited_at','is',null).order('edited_at',{ascending:false}).limit(30)]);
 const wid=[...new Set((cr.data||[]).map(c=>c.workout_id))],rid=[...new Set((rr.data||[]).map(x=>x.race_id))];
 const [wd,rd]=await Promise.all([wid.length?sb.from('workouts').select('id,type,workout_date').in('id',wid):{data:[]},rid.length?sb.from('races').select('id,name,race_date').in('id',rid):{data:[]}]);
 const wm={},rm={};(wd.data||[]).forEach(w=>wm[w.id]=w);(rd.data||[]).forEach(r=>rm[r.id]=r);
 return [...(pr.data||[]).map(p=>({k:'plan:'+p.id,v:'plan',t:'pc-'+p.id,at:p.created_at,h:`Your coach added <b>${esc(p.title)}</b> for ${esc(p.plan_date)}${tot(p)?' • '+tot(p):''}`})),
  ...(cr.data||[]).map(c=>{const w=wm[c.workout_id];return{k:'cm:'+c.id,v:'load',t:'w-'+c.workout_id,at:c.created_at,h:`Your coach commented on your ${esc(w?(TYPES[w.type]||w.type):'activity')}${w?' ('+esc(w.workout_date)+')':''}<div class="cm">${esc(c.body)}</div>`}}),
  ...(rr.data||[]).filter(x=>rm[x.race_id]).map(x=>({k:'race:'+x.id,v:'home',at:x.created_at,h:`You were assigned <b>${esc(rm[x.race_id].name)}</b> (${esc(rm[x.race_id].race_date)}${x.distance?' • '+esc(x.distance):''})${x.goal?' • Goal: '+esc(x.goal):''}`})),
  ...(er.data||[]).map(w=>({k:'we:'+w.id+'|'+w.edited_at,v:'load',t:'w-'+w.id,at:w.edited_at,h:`Your coach edited your ${esc(TYPES[w.type]||w.type)} (${esc(w.workout_date)})`}))].filter(i=>i.at).sort((x,y)=>new Date(y.at)-new Date(x.at)).slice(0,50)}
async function aNotes(mn){
 mn.innerHTML=`<div class="narrow">${H('Notifications')}${NI.length?NI.map((i,x)=>{const nw=isNew(i);
  return `<div class="pc ${nw?'new':''}" data-x="${x}" style="cursor:pointer"><div class="ph"><span>${esc(new Date(i.at).toLocaleString())}</span>${nw?'<span class="bdg" style="--c:#FF4F5E;margin:0">New</span>':''}</div><div>${i.h}</div></div>`}).join(''):'<div class="card empty">No updates yet.</div>'}</div>`;
 document.querySelectorAll('#mn [data-x]').forEach(e=>e.onclick=async()=>{const i=NI[+e.dataset.x];await markRead(i.k);view=i.v;jump=i.t||null;athleteView()})}

async function pgAbout(mn){
 const ic=(href,label,svg,ext)=>`<a class="ci" href="${href}"${ext?' target="_blank" rel="noopener noreferrer"':''} aria-label="${label}" title="${label}">${svg}</a>`;
 const card=(t,b)=>`<div class="card" style="margin-top:14px"><h2 style="margin-top:0">${t}</h2>${b}</div>`;
 mn.innerHTML=`<div class="narrow">${H('About')}<div class="card"><h2 style="margin-top:0">OUR MISSION</h2><p class="pre">${esc(ABOUT.mission)}</p></div>
 ${card('WHY RUNOVA',`<p class="pre">${esc(ABOUT.why)}</p>`)}
 ${card('WHAT YOU GET',`<ul class="ab">${ABOUT.get.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`)}
 ${card('CONTACT US',`<div class="cis">${ic('https://ig.me/m/runovacoaching','Instagram','<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><path d="M17.5 6.5h.01"/></svg>',1)}${ic('mailto:runovacoaching@gmail.com','Email','<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>',0)}</div>`)}</div>`;
 const em=mn.querySelector('a[href^="mailto:"]');
 if(em)em.onclick=e=>{if(!matchMedia('(pointer:coarse)').matches){e.preventDefault();window.open('https://mail.google.com/mail/?view=cm&fs=1&to=runovacoaching@gmail.com','_blank','noopener')}}}

function setHH(){const t=$('.top');if(t)document.documentElement.style.setProperty('--hh',t.offsetHeight+'px')}
$('#mnu').onclick=()=>document.body.classList.toggle('menu-open');$('#mbd').onclick=()=>document.body.classList.remove('menu-open');
window.addEventListener('resize',()=>{setHH();if(innerWidth>820)document.body.classList.remove('menu-open')});setHH();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(setHH);if(window.ResizeObserver)new ResizeObserver(setHH).observe($('.top'));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!='visible'||!me)return;const a=document.activeElement;if(document.querySelector('.ov')||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))return;if(me.role=='athlete')athleteView();else coachView()});
boot();
</script>
