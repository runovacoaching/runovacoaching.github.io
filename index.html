<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUNOVA</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F3F6;--ink:#101B2B;--mute:#5B6676;--line:#D9DEE6;--card:#fff;--blue:#1E45C8;--gold:#FFB400;--red:#C62828}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Readex Pro",Tahoma,sans-serif}
.top{background:var(--ink);color:#fff;padding:18px 20px 0}
.top .row{display:flex;justify-content:space-between;align-items:center;max-width:720px;margin:0 auto}
.brand{font-weight:700;font-size:1.35rem;letter-spacing:.18em;direction:ltr}
.brand small{font-weight:400;letter-spacing:0;font-size:.85rem;opacity:.7;margin-inline-start:8px}
.lanes{height:14px;margin-top:16px;background:repeating-linear-gradient(90deg,var(--gold) 0 36px,transparent 36px 44px) 0 3px/100% 2px no-repeat,repeating-linear-gradient(90deg,#fff 0 36px,transparent 36px 44px) 0 10px/100% 2px no-repeat;opacity:.9}
main{max-width:720px;margin:0 auto;padding:20px}
h2{font-size:1.15rem;margin:28px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
label{display:block;font-size:.88rem;color:var(--mute);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:11px 18px;background:var(--blue);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:inherit;border:1px solid currentColor;padding:6px 12px;font-weight:400;font-size:.88rem}
button.tab{background:none;color:var(--mute);border-radius:0;border-bottom:3px solid transparent;padding:8px 14px}
button.tab.on{color:var(--ink);border-color:var(--gold)}
.tabs{display:flex;margin-bottom:16px}
.err{color:var(--red);font-size:.9rem;margin:10px 0 0;min-height:1.4em}
.stats{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;align-items:end}
.big{font-weight:700;font-size:3rem;line-height:1;direction:ltr;text-align:right}
.big span{font-size:1rem;font-weight:400;color:var(--mute);margin-inline-start:4px}
.lbl{font-size:.85rem;color:var(--mute)}
.mid{font-weight:700;font-size:1.5rem;line-height:1.2}
.w{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.w:last-child{border:0}
.w b{font-weight:600}
.w .m{color:var(--mute);font-size:.88rem}
.w .n{font-size:.9rem;margin-top:2px}
.x{background:none;color:var(--mute);padding:2px 8px;font-weight:400;font-size:1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:400}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{color:var(--mute);padding:14px 0}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.stats>:first-child{grid-column:1/-1}.big{font-size:2.6rem}}
</style>
</head>
<body>
<header class="top"><div class="row"><div class="brand">RUNOVA<small>كوتشينج</small></div><div id="who"></div></div><div class="lanes"></div></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://fsgawcqntgvfpbxytwhx.supabase.co','sb_publishable_8heKxg7yMRJrV2qbB1hH-Q_ZJqxktXZ');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPES={easy:'جري خفيف',long:'جري طويل',tempo:'تمبو',interval:'فترات',strength:'قوة',stretch:'إطالة',race:'سباق'};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const weekStart=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+1)%7));return iso(d)};
const num=v=>v===''||v==null?null:Number(v);
const fmt=n=>Number.isInteger(n)?n:n.toFixed(1);
let me=null,mode='in',picked=null;

function msg(e){const m=(e&&e.message)||'';
 if(/Invalid login/i.test(m))return 'اليوزر نيم أو الباسورد غلط';
 if(/already registered/i.test(m))return 'اليوزر نيم ده مستخدم، اختار غيره';
 if(/at least 6/i.test(m))return 'الباسورد لازم يكون 6 حروف أو أرقام على الأقل';
 return 'حصلت مشكلة: '+m}

function authView(){
 $('#who').innerHTML='';
 $('#app').innerHTML=`<div class="card"><div class="tabs"><button class="tab ${mode=='in'?'on':''}" data-m="in">دخول</button><button class="tab ${mode=='up'?'on':''}" data-m="up">حساب جديد</button></div>
 <div class="grid">${mode=='up'?'<div class="full"><label for="fn">الاسم</label><input id="fn" autocomplete="name"></div>':''}
 <div class="full"><label for="un">اليوزر نيم (حروف إنجليزي وأرقام)</label><input id="un" dir="ltr" autocapitalize="none" autocomplete="username"></div>
 <div class="full"><label for="pw">الباسورد</label><input id="pw" type="password" dir="ltr" autocomplete="${mode=='in'?'current-password':'new-password'}"></div>
 <div class="full"><button id="go">${mode=='in'?'دخول':'إنشاء الحساب'}</button></div></div><p class="err" id="err" role="alert"></p></div>`;
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.m;authView()});
 $('#go').onclick=async()=>{
  const u=$('#un').value.trim().toLowerCase(),p=$('#pw').value;
  if(!/^[a-z0-9_]{3,20}$/.test(u))return $('#err').textContent='اليوزر نيم من 3 إلى 20 حرف إنجليزي أو رقم أو _';
  const email=u+'@runova.app';$('#go').disabled=true;
  const r=mode=='in'?await sb.auth.signInWithPassword({email,password:p}):await sb.auth.signUp({email,password:p,options:{data:{full_name:($('#fn')?.value||'').trim()}}});
  $('#go').disabled=false;
  if(r.error)return $('#err').textContent=msg(r.error);
  if(!r.data.session)return $('#err').textContent='الحساب اتعمل بس لازم تقفل Confirm email في Supabase';
  boot()}}

async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session)return authView();
 const {data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
 if(error||!data){await sb.auth.signOut();return authView()}
 me=data;
 $('#who').innerHTML=`<span>${esc(me.full_name||me.username)}</span> <button class="ghost" id="out">خروج</button>`;
 $('#out').onclick=async()=>{await sb.auth.signOut();me=null;picked=null;authView()};
 me.role=='coach'?coachView():athleteView()}

function statsHTML(ws){
 const wk=ws.filter(w=>w.workout_date>=weekStart());
 const km=wk.reduce((a,w)=>a+(+w.distance_km||0),0);
 const ef=wk.filter(w=>w.effort);const avg=ef.length?ef.reduce((a,w)=>a+w.effort,0)/ef.length:null;
 return `<div class="card stats"><div><div class="big">${fmt(km)}<span>كم</span></div><div class="lbl">مسافة الأسبوع ده (من السبت)</div></div>
 <div><div class="mid">${wk.length}</div><div class="lbl">تمرينات</div></div>
 <div><div class="mid">${avg?fmt(avg):'-'}</div><div class="lbl">متوسط المجهود</div></div></div>`}

function listHTML(ws,edit){
 if(!ws.length)return '<div class="empty">مفيش تمرينات متسجلة لسه.</div>';
 return ws.map(w=>`<div class="w"><div><b>${TYPES[w.type]||esc(w.type)}</b> <span class="m">${esc(w.workout_date)}</span>
 <div class="m">${[w.distance_km!=null?fmt(+w.distance_km)+' كم':'',w.duration_min!=null?fmt(+w.duration_min)+' دقيقة':'',w.effort?'مجهود '+w.effort+'/10':''].filter(Boolean).join(' • ')}</div>
 ${w.notes?`<div class="n">${esc(w.notes)}</div>`:''}</div>${edit?`<button class="x" data-del="${esc(w.id)}" aria-label="مسح التمرين">×</button>`:''}</div>`).join('')}

async function fetchWs(id){const {data}=await sb.from('workouts').select('*').eq('athlete_id',id).order('workout_date',{ascending:false}).order('created_at',{ascending:false}).limit(60);return data||[]}

async function athleteView(){
 $('#app').innerHTML=`<div id="st"></div><h2>سجّل تمرين</h2><div class="card"><div class="grid">
 <div><label for="d">التاريخ</label><input id="d" type="date" value="${iso(new Date())}"></div>
 <div><label for="t">النوع</label><select id="t">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
 <div><label for="km">المسافة (كم)</label><input id="km" type="number" step="0.01" min="0" inputmode="decimal"></div>
 <div><label for="mn">المدة (دقيقة)</label><input id="mn" type="number" step="1" min="0" inputmode="numeric"></div>
 <div class="full"><label for="ef">مجهودك من 1 لـ 10</label><input id="ef" type="number" min="1" max="10" inputmode="numeric"></div>
 <div class="full"><label for="nt">ملاحظات</label><textarea id="nt" rows="2"></textarea></div>
 <div class="full"><button id="save">حفظ التمرين</button></div></div><p class="err" id="err" role="alert"></p></div>
 <h2>تمريناتك</h2><div class="card" id="ls"></div>`;
 $('#save').onclick=async()=>{
  const ef=num($('#ef').value);
  if(ef!=null&&(ef<1||ef>10))return $('#err').textContent='المجهود من 1 لـ 10';
  if(num($('#km').value)==null&&num($('#mn').value)==null)return $('#err').textContent='اكتب المسافة أو المدة على الأقل';
  $('#save').disabled=true;
  const {error}=await sb.from('workouts').insert({athlete_id:me.id,workout_date:$('#d').value,type:$('#t').value,distance_km:num($('#km').value),duration_min:num($('#mn').value),effort:ef,notes:$('#nt').value.trim()||null});
  $('#save').disabled=false;
  if(error)return $('#err').textContent=msg(error);
  ['km','mn','ef','nt'].forEach(i=>$('#'+i).value='');$('#err').textContent='';refresh()};
 async function refresh(){const ws=await fetchWs(me.id);$('#st').innerHTML=statsHTML(ws);$('#ls').innerHTML=listHTML(ws,true);
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('تمسح التمرين ده؟'))return;await sb.from('workouts').delete().eq('id',b.dataset.del);refresh()})}
 refresh()}

async function coachView(){
 const {data}=await sb.from('profiles').select('id,full_name,username').eq('coach_id',me.id).order('full_name');
 const as=data||[];
 if(!as.length){$('#app').innerHTML='<div class="card"><b>مفيش رياضيين مربوطين بيك لسه.</b><p class="lbl">بعد ما الرياضي يعمل حساب، اربطه بيك من Supabase (SQL Editor).</p></div>';return}
 picked=picked&&as.find(a=>a.id==picked)?picked:as[0].id;
 $('#app').innerHTML=`<div class="chips">${as.map(a=>`<button class="chip ${a.id==picked?'on':''}" data-a="${esc(a.id)}">${esc(a.full_name||a.username)}</button>`).join('')}</div><div id="st" style="margin-top:16px"></div><h2>التمرينات</h2><div class="card" id="ls"></div>`;
 document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{picked=b.dataset.a;coachView()});
 const ws=await fetchWs(picked);$('#st').innerHTML=statsHTML(ws);$('#ls').innerHTML=listHTML(ws,false)}

boot();
</script>
</body>
</html>
